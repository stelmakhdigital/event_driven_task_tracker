name: Update ADR Table

on:
  push:
    branches:
      - master
      - dev
    paths:
      - "docs/ADRs/**/*.md" # триггер при файлов
      - ".github/workflows/update-adr-table.yml"  # триггер при изменении самого workflow

jobs:
  update-table:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0  # для получения истории коммитов
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        
    - name: Detect ADR changes
      id: adr-changes
      run: |
        # проверяем изменения только в ADR-файлах
        ADR_FILES=$(git diff --name-only HEAD^ HEAD -- "docs/ADRs/*.md")
        if [ -n "$ADR_FILES" ]; then
          echo "changes_detected=true" >> $GITHUB_OUTPUT
        else
          echo "changes_detected=false" >> $GITHUB_OUTPUT
        fi
        
    - name: Update ADR table
      if: ${{ steps.adr-changes.outputs.changes_detected == "true" }}
      run: |
        pip install regex
        python scripts/update_adr_table.py
        
    - name: Commit changes
      if: ${{ steps.adr-changes.outputs.changes_detected == "true" }}
      run: |
        git config user.name "github-actions"
        git config user.email "actions@users.noreply.github.com"
        git add docs/readme.md
        
        # Проверяем, есть ли изменения для коммита
        if git diff-index --quiet HEAD --; then
          echo "No changes to commit"
        else
          git commit -m "📊 Auto-update ADR table"
          git push
        fi
